name: 毎日の天気ロボット

on:
  schedule:
    # 毎日、日本の朝7時に動く設定
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  tenki-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 天気を表示する
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        run: python weather.py
